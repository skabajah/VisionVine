<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisionVine – AI Label Verification</title>
    <link rel="stylesheet" href="../static/style.css" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

    <div class="container">

        <!-- Header -->
        <header>
            <h1>VisionVine</h1>
            <p class="tagline">AI-Powered Alcohol Label Verification</p>
        </header>

        <!-- Main Layout: Left (Upload) + Right (Results) -->
        <main class="split">

            <!-- ===== LEFT SIDE: UPLOAD ===== -->
            <section class="upload-panel">

                <h2>Upload Label</h2>

                <!-- Drop Zone with large + button -->
                <div class="drop-zone" id="dropZone">
                    <button class="btn-plus" id="browseBtn" type="button">
                        <span class="material-icons">add_photo_alternate</span>
                    </button>
                    <p class="drop-text">Upload up to 3 images</p>
                    <p class="hint">Click the + button or drag &amp; drop</p>
                    <input type="file" id="fileInput" accept="image/*" multiple hidden />
                </div>

                <!-- Thumbnails Preview -->
                <div class="thumbnails" id="thumbnails"></div>

                <!-- Process Button -->
                <button class="btn-primary" id="processBtn">Process This</button>

                <!-- Status Message -->
                <div id="statusMessage" class="status-message"></div>

            </section>

            <!-- ===== RIGHT SIDE: RESULTS ===== -->
            <section class="results-panel">

                <h2>Verification Results</h2>

                <!-- Results will be injected here by app.js -->
                <div id="resultsContainer">
                    <p class="placeholder">Results will appear here.</p>
                </div>

            </section>

        </main>

        <!-- Footer -->
        <footer>
            <p>VisionVine &bull; Prototype for TTB Label Compliance &bull;  skabajah@icloud.com  &bull;  2026-08-06</p>
        </footer>

    </div>

    <script src="../static/app.js"></script>
    <script src="../static/cleaner.js"></script>

</body>
</html>
