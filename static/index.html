<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisionVine – AI Label Verification</title>
    <link rel="stylesheet" href="https://visionvine.onrender.com/static/style.css" />
</head>
<body>

    <div class="container">

        <!-- Header -->
        <header>
            <h1>VisionVine</h1>
            <p class="tagline">AI-Powered Alcohol Label Verification</p>
        </header>

        <!-- Main Layout: Left (Upload) + Right (Results) -->
        <main class="split">

            <!-- ===== LEFT SIDE: UPLOAD ===== -->
            <section class="upload-panel">

                <h2>Upload Label</h2>

                <!-- Drop Zone -->
                <div class="drop-zone" id="dropZone">
                    <p>📸 Drag &amp; drop label images here</p>
                    <p class="hint">(1–3 images per product)</p>
                    <input type="file" id="fileInput" accept="image/*" multiple hidden />
                    <button class="btn-secondary" id="browseBtn">Browse Files</button>
                </div>

                <!-- Thumbnails Preview -->
                <div class="thumbnails" id="thumbnails"></div>

                <!-- Process Button -->
                <button class="btn-primary" id="processBtn">🚀 PROCESS THIS</button>

                <!-- Status Message -->
                <div id="statusMessage" class="status-message"></div>

            </section>

            <!-- ===== RIGHT SIDE: RESULTS ===== -->
            <section class="results-panel">

                <h2>Verification Results</h2>

                <!-- Results will be injected here by app.js -->
                <div id="resultsContainer">
                    <p class="placeholder">Upload a label and click "PROCESS THIS" to see results.</p>
                </div>

            </section>

        </main>

        <!-- Footer -->
        <footer>
            <p>VisionVine &bull; Prototype for TTB Label Compliance</p>
        </footer>

    </div>

    <script src="https://visionvine.onrender.com/static/app.js"></script>
</body>
</html>
