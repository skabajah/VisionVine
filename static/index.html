<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Ownership & Attribution Meta Tags -->
    <meta name="author" content="Shadi Kabajah">
    <meta name="email" content="skabajah@icloud.com">
    <meta name="website" content="skabajah.github.io">
    <meta name="project" content="VisionVine – AI Label Verification">
    <meta name="copyright" content="VisionVine 2026">
    <meta name="created" content="2026-08-07">
    
    <title>VisionVine – AI Label Verification</title>
    <link rel="stylesheet" href="../static/style.css" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../static/icon.svg">

</head>
<body>

    <div class="container">

        <header>
            <h1>VisionVine</h1>
            <p class="tagline">AI-Powered Alcohol Label Verification
            <img src="../static/icon.svg">
            </p>
        </header>

        <main class="split">

            <!-- ===== LEFT: UPLOAD ===== -->
            <section class="upload-panel">

                <h2>Upload Label</h2>

                <div class="drop-zone" id="dropZone">
                    <button class="btn-plus" id="browseBtn" type="button">
                        <span class="material-icons">add_photo_alternate</span>
                    </button>
                    <p class="drop-text">Upload up to 3 images</p>
                    <p class="hint">Click the + button or drag &amp; drop</p>
                    <input type="file" id="fileInput" accept="image/*" multiple hidden />
                </div>

                <div class="thumbnails" id="thumbnails"></div>

                <button class="btn-primary" id="processBtn">Upload Images First</button>

                <div id="statusMessage" class="status-message"></div>

            </section>

            <!-- ===== RIGHT: RESULTS ===== -->
            <section class="results-panel">

                <h2>Verification Results</h2>

                <div id="resultsContainer">
                    <p class="placeholder">Results will appear here.</p>
                </div>

            </section>

        </main>

        <footer>
            <p>
                VisionVine &bull; Prototype for TTB Label Compliance &bull; 
                <a href="https://skabajah.github.io/VisionVine/" target="_blank" rel="noopener noreferrer">GitHub</a> &bull; 
                <a href="mailto:skabajah@icloud.com">skabajah@icloud.com</a> &bull; 
                2026
            </p>
        </footer>

    </div>

    <script src="../static/cleaner.js"></script>
    <script src="../static/app.js"></script>

</body>
</html>
